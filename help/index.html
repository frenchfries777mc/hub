<script>
/* 질문과 답변은 여기만 고치면 돼요: [분류, 아이디, 질문, 답변 HTML] */
var QA=[
['시작하기','start','Frenchfries777은 어떤 곳이에요?',
 '<p>Frenchfries777은 한 사람이 직접 만든 게임, 교육 프로그램, 도구를 한곳에 모아 둔 사이트예요. 따로 설치할 필요 없이 브라우저에서 바로 쓸 수 있고, 돈을 받지 않아요.</p><p>사이트는 크게 네 군데로 나뉘어 있어요. 화면 위쪽의 <b>허브, 게임, 교육, 도구</b> 탭으로 서로 오갈 수 있고, 어느 곳에서 로그인해도 나머지 곳에서 로그인된 채로 시작해요.</p><ul><li><b>허브</b>: 첫 화면이에요. 위키, 커뮤니티, 라운지, 음악 감상실, 패치노트, 설정이 여기에 있어요. 허브 코인도 여기서 관리해요.</li><li><b>게임</b>: Stickseum, Crown Envoy, Beaconfall, Isleport, Vowkeep, Tumble Crown, Dummy Party가 있어요. 아직 만드는 중인 게임은 프로토타입 칸에 따로 모여 있어요.</li><li><b>교육</b>: 행성 탐사, SpeedCode, Timeline Battle, 문장 수리공, 평형 설계실, 속담 탐정이 있어요. 수업에서 반 친구들과 같이 쓰기 좋게 만들었어요.</li><li><b>도구</b>: Fry Code, Block HTML, Fry Sheet, Fry Docs, Fry Slides, Fry Lab, Fry Draw, Fry Score, Fry Video가 있어요. 코딩, 문서, 발표, 실험, 그림, 악보, 영상 편집을 브라우저 안에서 해결해요.</li></ul><p>처음이라면 허브에서 마음에 드는 게임을 하나 눌러 보세요. 로그인은 나중에 해도 괜찮아요.</p>'],
['시작하기','free','돈이 드나요? 로그인해야 하나요?',
 '<p>돈은 전혀 들지 않아요. 결제를 요구하는 화면도 없어요. 사이트의 코인은 모두 게임을 하거나 출석해서 모으는 코인이고, 현금으로 사는 코인은 없어요.</p><p>로그인하지 않아도 거의 모든 게임과 프로그램을 쓸 수 있어요. 다만 로그인하면 다음이 가능해져요.</p><ul><li>게임 기록이 계정에 저장돼서 다른 기기에서도 이어서 볼 수 있어요.</li><li>매일 접속하면 허브 코인을 받아요.</li><li>친구를 추가하고 커뮤니티에 글, 사진, 댓글을 남길 수 있어요.</li><li>음악 감상실의 곡을 mp3로 내려받을 수 있어요.</li><li>도구에서 서버에 파일을 16MB까지 저장할 수 있어요.</li></ul><p>자세한 내용은 아래 <a data-go="features">계정으로 할 수 있는 일</a>에도 정리해 두었어요.</p>'],
['시작하기','devices','어떤 기기와 브라우저에서 쓸 수 있어요?',
 '<p>브라우저가 있는 컴퓨터, 태블릿, 휴대폰에서 쓸 수 있어요. 크롬, 엣지, 사파리, 파이어폭스 같은 흔한 브라우저면 대부분 잘 돌아가요.</p><ul><li><b>컴퓨터</b>: 가장 편해요. 키보드와 마우스로 하는 게임은 컴퓨터를 권해요.</li><li><b>태블릿과 휴대폰</b>: 터치로 할 수 있게 만든 게임이 많지만, 키보드 조작이 꼭 필요한 게임은 불편할 수 있어요.</li></ul><p>화면이 버벅거리거나 기기가 뜨거워지면 <a data-go="perf">최적화 설정</a>을 켜 보세요. 효과를 줄여서 훨씬 가벼워져요.</p><div class="note">너무 오래된 브라우저에서는 일부 기능(AI 도우미, 파이썬 실행 등)이 안 될 수 있어요. 브라우저를 최신으로 올리면 대부분 해결돼요.</div>'],
['시작하기','mobile','휴대폰에서 앱처럼 쓸 수 있어요?',
 '<p>설치형 앱은 따로 없어요. 대신 브라우저의 "홈 화면에 추가" 기능을 쓰면 휴대폰 홈 화면에 바로가기를 만들어서 앱처럼 열 수 있어요.</p><p>도구 중 일부(Fry Sheet 등)는 앱처럼 설치하는 기능도 지원해요. 이 경우 도구 화면에 설치 안내가 나타나요.</p><div class="note">브라우저 종류와 버전에 따라 메뉴 이름이 달라서, 정확한 위치는 브라우저 설명서를 참고해 주세요.</div>'],
['계정','acct','계정은 어떻게 만들어요?',
 '<p>세 가지 방법이 있어요.</p><ol><li><b>아이디로 가입</b>: 허브 첫 화면의 회원가입 버튼에서 아이디를 만들어요.</li><li><b>Google로 로그인</b>: Google 버튼을 누르면 가입과 로그인이 한 번에 끝나요.</li><li><b>GitHub로 로그인</b>: GitHub 버튼으로도 똑같이 해요.</li></ol><p>한 번 로그인하면 허브, 게임, 교육, 도구 어디서든 로그인된 채로 시작해요. 사이트마다 따로 가입할 필요가 없어요.</p><div class="note">닉네임은 다른 사람에게 보이는 이름이에요. 개인정보(실명, 전화번호 등)를 닉네임으로 쓰지 않는 것을 권해요.</div>'],
['계정','features','계정으로 할 수 있는 일',
 '<p>Frenchfries777 계정을 만들거나 Google, GitHub로 로그인하면 이런 걸 쓸 수 있어요.</p><ul><li><b>게임 기록 저장</b>: 로그인한 상태로 플레이한 기록이 계정에 저장돼요. 집 컴퓨터에서 하던 게임을 학교나 휴대폰에서 이어서 볼 수 있어요.</li><li><b>매일 허브 코인</b>: 매일 접속하면 10개를 받고, 7일 연속이면 보너스가 붙어요. 코인은 게임 코인으로 바꾸거나 프로필 꾸미기에 써요. <a data-go="coin">허브 코인 설명</a></li><li><b>친구와 커뮤니티</b>: 친구를 추가하고, 접속 중인지 보고, 커뮤니티에 글, 사진, 투표, 피드백을 남길 수 있어요. <a data-go="friends">친구 추가</a></li><li><b>음악 다운로드</b>: 음악 감상실의 곡을 mp3로 받을 수 있어요. <a data-go="music">음악 안내</a></li><li><b>도구 16MB 무료 저장 공간</b>: Fry Sheet, Fry Docs 같은 도구의 파일을 서버에 저장해서 어디서든 열 수 있어요. <a data-go="storage">저장 공간 안내</a></li></ul><p>로그인하지 않아도 게임과 프로그램은 쓸 수 있어요. 위 기능만 계정이 필요해요.</p>'],
['계정','save','게임 기록은 어디에 저장돼요?',
 '<p>로그인한 상태로 플레이하면 기록이 계정에 저장돼서 다른 기기에서도 이어서 볼 수 있어요. 컴퓨터를 바꾸거나 브라우저 데이터를 지워도 기록이 남아요.</p><p>로그인하지 않고 플레이한 기록은 지금 쓰는 브라우저에만 남아요. 이 경우 다음 상황에서 기록이 사라질 수 있어요.</p><ul><li>브라우저의 사이트 데이터나 쿠키를 지웠을 때</li><li>다른 기기나 다른 브라우저로 옮겼을 때</li><li>비공개(시크릿) 창에서 플레이했을 때</li></ul><p>오래 즐기실 거라면 로그인한 상태로 플레이하는 것을 권해요.</p>'],
['계정','friends','친구는 어떻게 추가해요?',
 '<ol><li>로그인해요.</li><li>화면 오른쪽 위의 계정 버튼을 눌러 계정 메뉴를 열어요.</li><li>친구 항목에서 상대의 닉네임으로 찾아 요청을 보내요.</li><li>상대가 요청을 받아들이면 친구가 돼요.</li></ol><p>친구가 되면 친구가 지금 접속 중인지 볼 수 있어요. 친구가 올린 글이 있으면 알림으로도 알려 줘요.</p><div class="note">모르는 사람의 요청은 받지 않아도 돼요. 불쾌한 글이나 행동은 <a data-go="report">신고</a>해 주세요.</div>'],
['계정','avatar','프로필 사진과 테두리는 어떻게 바꿔요?',
 '<p>계정 메뉴의 프로필에서 바꿀 수 있어요.</p><ul><li><b>프로필 사진</b>: 지금 있는 17가지를 모두 무료로 고를 수 있어요. 게임별, 프로그램별 그림이 들어 있어요.</li><li><b>프로필 테두리</b>: 사진 둘레를 꾸며 주는 장식이에요. 허브 코인으로 사서 끼울 수 있어요.</li><li><b>칭호</b>: 닉네임 옆에 붙는 짧은 문구예요. 어떤 칭호를 쓸 수 있는지는 프로필 화면에서 확인해 주세요.</li></ul><p>바꾼 모습은 커뮤니티 글, 댓글, 친구 목록에서 다른 사람에게도 보여요.</p>'],
['허브 코인','coin','허브 코인은 뭐예요? 어떻게 모아요?',
 '<p>허브 코인은 로그인한 사람에게 주는 사이트 공통 코인이에요. 게임을 하다 얻는 게임 코인과는 별개이고, 게임 코인으로 바꿀 수 있어요.</p><p>모으는 방법은 이래요.</p><ul><li><b>출석</b>: 매일 접속하면 10개를 받아요. 7일 연속이면 보너스 20개가 더 붙어요.</li><li><b>퀘스트</b>: 코인 창의 퀘스트 탭에서 지금 할 수 있는 퀘스트를 볼 수 있어요.</li><li><b>선물 코드</b>: 코드를 받으면 코인으로 바꿀 수 있어요. <a data-go="code">코드 입력 방법</a></li></ul><p>화면 위쪽의 코인 표시를 누르면 코인 창이 열려요. 교환, 퀘스트, 기록, 코드 탭이 있고, 기록 탭에서 코인이 언제 얼마나 들고 났는지 볼 수 있어요.</p><p>모은 코인은 <a data-go="exchange">게임 코인으로 교환</a>하거나 프로필 테두리를 사는 데 써요.</p>'],
['허브 코인','exchange','허브 코인을 게임 코인으로 바꾸려면?',
 '<p>코인 창의 교환 탭에서 바꿀 수 있어요. 바꾸려는 게임을 고르고 허브 코인 개수를 넣으면, 받게 될 게임 코인이 미리 보여요. 확인하고 누르면 바뀌어요.</p><p>허브 코인 1개로 받는 게임 코인은 아래와 같아요.</p><table><tr><th>게임</th><th>허브 코인 1개</th></tr><tr><td>Stickseum</td><td>5</td></tr><tr><td>Beaconfall</td><td>5</td></tr><tr><td>Crown Envoy</td><td>20</td></tr><tr><td>Dummy Party</td><td>7</td></tr><tr><td>Vowkeep</td><td>15</td></tr><tr><td>Tumble Crown</td><td>35</td></tr><tr><td>Gatecrash</td><td>10</td></tr></table><p>게임마다 값이 다른 건 게임 안에서 쓰는 가격표가 서로 다르기 때문이에요. 예를 들어 Dummy Party의 스킨은 가격이 높은 대신 한 번에 많이 바꿀 수 있어요.</p><div class="note">비율은 게임 사정에 따라 바뀔 수 있어요. 정확한 값은 교환 탭에 보이는 숫자를 기준으로 봐 주세요.</div>'],
['허브 코인','code','선물 코드는 어디에 입력해요?',
 '<ol><li>화면 위쪽의 코인 표시를 눌러 코인 창을 열어요.</li><li>코드 탭을 골라요.</li><li>6자리 코드를 넣고 확인을 눌러요.</li></ol><p>맞는 코드면 허브 코인 60개를 받아요. 한글 자판 상태로 써도 영어 대문자로 바뀌고, 띄어쓰기는 필요 없어요.</p><ul><li>코드는 한 번만 쓸 수 있어요. 이미 쓴 코드는 다시 쓸 수 없어요.</li><li>로그인해야 입력할 수 있어요.</li><li>글자가 헷갈리면 0(영)과 O(오), 1과 I를 구분해서 다시 넣어 보세요.</li></ul>'],
['게임','games','어떤 게임들이 있어요?',
 '<ul><li><b>Stickseum</b>: 막대 인간 캐릭터로 싸우는 대전 게임이에요. 캐릭터가 많고 온라인으로도 겨룰 수 있어요.</li><li><b>Crown Envoy</b>: 사절을 보내 외교를 하고 전쟁으로 제국을 키우는 전략 게임이에요.</li><li><b>Beaconfall</b>: 섬을 탐험하고 만드는 샌드박스 게임이에요. 직접 만든 모드를 올리는 모드 페이지와, 모드를 짜는 BeaconScript도 있어요.</li><li><b>Isleport</b>: 내 섬을 키우고 만든 물건을 배로 날라 다른 섬과 거래하는 게임이에요.</li><li><b>Vowkeep</b>: 기사들이 함께 던전을 내려가는 게임이에요.</li><li><b>Tumble Crown</b>: 팀을 나눠 겨루는 온라인 게임이에요.</li><li><b>Dummy Party</b>: 여럿이 모여 즐기는 미니게임 파티예요.</li></ul><p>게임마다 공략과 조작법은 <a href="../wiki/">위키</a>에 정리돼 있어요. 업데이트 내용은 <a href="../patchnotes/">패치노트</a>에서 볼 수 있어요.</p>'],
['게임','proto','프로토타입은 뭐예요?',
 '<p>아직 만드는 중인 게임을 모아 둔 곳이에요. 정식 게임으로 내놓기 전에 먼저 해 보고 의견을 주시라고 열어 둔 거예요.</p><ul><li>규칙이나 화면이 자주 바뀌어요.</li><li>빠진 기능이나 오류가 있을 수 있어요.</li><li>기록이 지워지거나 초기화될 수 있어요.</li></ul><p>해 보신 뒤 어떤 점이 재미있었고 어떤 점이 불편했는지 <a href="../community/">커뮤니티</a>에 남겨 주시면 만드는 데 큰 도움이 돼요.</p>'],
['게임','online','온라인으로 같이 하려면 어떻게 해요?',
 '<p>온라인을 지원하는 게임은 게임 화면에서 방 만들기나 온라인 모드를 고르면 돼요. 방을 만들면 방 코드나 목록이 생기고, 같이 할 사람이 그 방에 들어오면 돼요.</p><ul><li>같이 하는 사람과 같은 게임 버전이어야 해요. 한쪽이 오래된 화면을 보고 있으면 새로 고침해 주세요.</li><li>사람이 없으면 친구에게 방 코드를 알려 주거나, 연습 모드로 혼자 먼저 해 볼 수 있어요.</li><li>연결이 끊기면 방을 나갔다가 다시 들어와 보세요.</li></ul><div class="note">게임마다 지원하는 모드가 달라요. 어떤 모드가 있는지는 각 게임의 첫 화면과 위키에서 확인해 주세요.</div>'],
['게임','record','게임이 멈추거나 기록이 안 남아요.',
 '<p>아래 순서로 해 보세요.</p><ol><li>페이지를 새로 고쳐요.</li><li>로그인이 풀리지 않았는지 확인해요. 기록은 로그인한 상태에서만 계정에 저장돼요.</li><li>광고 차단 같은 브라우저 확장 프로그램을 잠시 끄고 해 봐요.</li><li>비공개(시크릿) 창이 아닌 일반 창에서 해 봐요.</li><li><a data-go="perf">최적화 설정</a>의 저사양 모드를 켜 봐요.</li></ol><p>그래도 안 되면 <a data-go="report">문제 신고</a>로 알려 주세요. 어떤 게임인지, 어떤 기기와 브라우저인지, 무엇을 했을 때 그랬는지 적어 주시면 훨씬 빨리 고칠 수 있어요.</p>'],
['교육','edu','교육 프로그램은 어떤 게 있어요?',
 '<ul><li><b>행성 탐사</b>: 지구본 같은 행성을 돌려 보며 배우는 프로그램이에요. 혼자 하거나 반 친구들과 같이 해요.</li><li><b>SpeedCode</b>: 이진수와 십진수 변환 같은 코드 읽기를 빠르게 겨뤄요.</li><li><b>Timeline Battle</b>: 흩어진 역사 사건을 시간 순서대로 맞춰요.</li><li><b>문장 수리공</b>: 뒤죽박죽이 된 문장에서 틀린 곳을 찾아 고쳐요.</li><li><b>평형 설계실</b>: 힘의 평형을 직접 그려 보며 배워요.</li><li><b>속담 탐정</b>: 속담과 관용구를 단서로 사건을 풀어요.</li></ul><p>혼자 해도 되고, 방을 만들어 여럿이 같이 할 수도 있어요. 대부분 한국어로 만들어져 있고, 설정에서 언어를 바꿔도 일부 프로그램은 한국어만 나와요.</p>'],
['교육','room','같이 하려면 어떻게 해요? (방 만들기)',
 '<ol><li>방을 지원하는 프로그램의 첫 화면에서 이름을 적어요.</li><li>방 만들기를 누르면 방 코드가 나와요.</li><li>같이 할 사람은 방 참가에서 그 코드를 넣어요.</li><li>사람이 모이면 방을 만든 사람이 시작해요.</li></ol><p>수업에서 쓰는 경우 선생님이 방을 만들고 학생들이 코드로 들어오면 돼요. 방은 프로그램마다 최대 인원이 달라요.</p><div class="note">방을 만든 사람이 창을 닫으면 방이 사라질 수 있어요. 모두 끝날 때까지 방 만든 사람의 창을 열어 두세요.</div>'],
['도구','tools','도구는 어떤 게 있어요?',
 '<ul><li><b>Fry Code</b>: 설치 없이 브라우저에서 파이썬, 자바스크립트, 자바, HTML, JSON, BeaconScript를 쓰고 바로 미리봐요. 파이썬은 거북이 그림과 그래프도 그려요.</li><li><b>Block HTML</b>: 블록을 쌓아서 웹페이지와 간단한 게임을 만들어요. 만든 것을 미리 보며 고칠 수 있어요.</li><li><b>Fry Sheet</b>: 엑셀처럼 쓰는 스프레드시트예요. .xlsx 파일을 열고 저장할 수 있어요.</li><li><b>Fry Docs</b>: 문서 편집기예요. docx 파일을 읽고 쓸 수 있어요.</li><li><b>Fry Slides</b>: 발표 자료를 만들어요.</li><li><b>Fry Lab</b>: 교과 단원별로 과학과 수학 실험을 직접 해 볼 수 있어요.</li><li><b>Fry Draw</b>: 브라우저에서 그림을 그려요.</li><li><b>Fry Score</b>: 악보를 그리고 바로 재생해 볼 수 있어요. MIDI와 PNG로 저장해요.</li><li><b>Fry Video</b>: 영상을 자르고 이어 붙이고, 글자와 소리를 넣어요. mp4나 webm으로 내보내요.</li></ul><p>대부분 도우미(AI)가 붙어 있어서 막힐 때 물어볼 수 있어요. <a data-go="ai">AI 도우미 안내</a></p>'],
['도구','storage','도구에는 파일이 얼마나 저장돼요?',
 '<p>로그인한 사람은 서버에 16MB까지 무료로 저장할 수 있어요. 로그인하지 않으면 지금 쓰는 브라우저에만 저장돼요.</p><ul><li><b>서버 저장</b>: 다른 기기에서도 열 수 있고, 브라우저 데이터를 지워도 남아요.</li><li><b>브라우저 저장</b>: 그 기기, 그 브라우저에서만 보여요.</li></ul><div class="note">브라우저에만 저장한 파일은 브라우저 데이터를 지우면 사라져요. 중요한 파일은 직접 내려받아 따로 보관해 두세요. 16MB가 넘으면 더 저장되지 않으니, 큰 사진이 많은 문서는 용량을 줄여 주세요.</div>'],
['도구','ai','AI 도우미는 어떻게 동작해요?',
 '<p>도구 안의 AI 도우미는 기본적으로 내 브라우저 안에서 도는 작은 모델을 써요. 이 경우 내가 쓴 내용이 밖으로 나가지 않아요. 다만 처음 불러올 때 시간이 걸리고, 기기 성능에 따라 못 돌릴 수도 있어요.</p><p>원하면 직접 가진 API 키를 넣어 외부 AI를 쓸 수도 있어요. 키는 내 브라우저에만 저장되고, 해당 서비스로 바로 보내져요.</p><ul><li>AI는 질문을 이해해서 식, 표, 코드, 슬라이드 초안을 만들어 줘요.</li><li>만들어진 결과는 되돌리기로 취소할 수 있는 곳이 많아요.</li></ul><div class="note">AI의 답은 틀릴 수 있어요. 숙제나 중요한 문서에 쓸 때는 꼭 직접 확인하세요. 개인정보나 비밀번호는 AI에 입력하지 마세요.</div>'],
['허브 둘러보기','wiki','위키, 커뮤니티, 라운지는 뭐가 달라요?',
 '<ul><li><b><a href="../wiki/">위키</a></b>: 게임 공략, 도구와 교육 프로그램 사용법을 모아 둔 곳이에요. 누구나 읽을 수 있어요. 어떤 게임이나 도구의 사용법이 궁금하면 제일 먼저 찾아볼 곳이에요.</li><li><b><a href="../community/">커뮤니티</a></b>: 글과 사진을 올리고, 댓글을 달고, 투표에 참여하고, 피드백을 남기는 곳이에요.</li><li><b><a href="../lounge/">라운지</a></b>: 잠깐 쉬어 가는 곳이에요.</li><li><b><a href="../music/">음악 감상실</a></b>: 게임 배경음악을 한곳에서 들어요.</li><li><b><a href="../patchnotes/">패치노트</a></b>: 게임과 허브가 업데이트될 때마다 바뀐 점을 적어요. 새 기능이 뭐가 들어왔는지 궁금하면 여기를 보세요.</li><li><b><a href="../settings/">설정</a></b>: 화면 색, 글자 크기, 언어, 최적화를 바꿔요.</li></ul>'],
['허브 둘러보기','music','음악 감상실의 곡을 내려받을 수 있나요?',
 '<p>곡마다 있는 ⬇ 버튼으로 mp3를 받을 수 있어요. 로그인한 사람만 받을 수 있어요.</p><p>음악 감상실에는 게임에 쓰는 배경음악이 모여 있어요.</p><p>Kevin MacLeod가 만든 곡(Oppressive Gloom, Crusade 등)은 원작자의 사이트(incompetech.com)로 연결돼요. 이 곡들은 Kevin MacLeod / CC BY 4.0 라이선스를 따르니, 다른 곳에 쓰실 때는 원작자 표기를 꼭 해 주세요.</p>'],
['허브 둘러보기','post','커뮤니티에 사진도 올릴 수 있어요?',
 '<p>네, 글을 쓸 때 사진을 최대 4장까지 붙일 수 있어요. 올리는 방법은 세 가지예요.</p><ul><li>사진 버튼을 눌러 파일을 고르기</li><li>컴퓨터의 사진 파일을 글쓰기 칸 위로 끌어다 놓기</li><li>복사한 이미지를 글쓰기 칸에 붙여 넣기</li></ul><p>글에는 투표를 붙일 수도 있고, 다른 사람의 글에 댓글과 반응을 남길 수 있어요.</p><div class="note">남의 얼굴이나 개인정보가 보이는 사진은 올리지 마세요. 부적절한 글은 신고할 수 있어요.</div>'],
['설정','theme','화면을 밝게 또는 어둡게 바꾸고 싶어요.',
 '<p>허브의 <a href="../settings/">설정</a>에서 <b>라이트</b>(흰 바탕)와 <b>다크</b>(검은 바탕) 중에 고를 수 있어요. 한 번 고르면 허브, 게임, 교육, 도구에 모두 같이 적용돼요.</p><p>두 화면 모두 황금색 포인트를 써요. 눈이 편한 쪽을 고르세요. 밤에 쓰시면 다크, 밝은 곳에서 쓰시면 라이트가 보기 편해요.</p><div class="note">고른 화면 색은 지금 쓰는 브라우저에 저장돼요. 다른 기기에서는 그 기기에서 다시 골라 주세요.</div>'],
['설정','size','글자가 너무 작아요.',
 '<p><a href="../settings/">설정</a>의 글자 크기에서 <b>작게, 보통, 크게, 아주 크게</b> 중에 고를 수 있어요. 허브와 게임 사이트의 첫 화면에 적용돼요.</p><p>게임 화면 안의 글자는 게임마다 따로 정해져 있어서 이 설정으로 바뀌지 않을 수 있어요. 그럴 때는 브라우저의 확대 기능(컴퓨터는 Ctrl과 + 키)을 같이 써 보세요.</p>'],
['설정','lang','언어를 바꾸려면요?',
 '<p>화면 오른쪽 위의 언어 버튼이나 <a href="../settings/">설정</a>의 언어에서 바꿀 수 있어요. 한 곳에서 바꾸면 허브, 게임, 교육, 도구가 같은 언어로 바뀌어요.</p><p>실제 언어 외에 아우레베시, 표준 은하어, 이모지어 같은 가상 언어도 골라 볼 수 있어요. 재미로 써 보세요. 이 언어들은 영어를 다른 글자로 바꿔서 보여 주는 거예요.</p><div class="note">번역은 계속 다듬는 중이라 어색한 곳이 있을 수 있어요. 일부 교육 프로그램은 한국어만 지원해요. 번역이 이상한 곳을 발견하면 <a data-go="report">알려 주세요</a>.</div>'],
['설정','perf','화면이 버벅거려요. (최적화)',
 '<p><a href="../settings/">설정</a>의 최적화에서 세 가지를 조절할 수 있어요.</p><ul><li><b>저사양 모드</b>: 효과, 그림자, 파티클을 줄이고 프레임을 30으로 제한해요. 오래된 기기나 휴대폰이라면 먼저 이걸 켜 보세요.</li><li><b>효과 품질</b>: 높음, 보통, 낮음 중에 골라요. 파티클, 그림자, 화면 효과의 양이 달라져요.</li><li><b>프레임 제한</b>: 초당 그리는 횟수를 낮춰서 기기 부담과 발열을 줄여요.</li></ul><p>이 설정은 지금 쓰는 브라우저에만 적용돼요. 허브와 모든 게임이 같은 값을 읽고, 바꾼 뒤에는 게임을 다시 열 때 적용돼요.</p><div class="note">효과를 줄이면 화려함은 줄지만 게임 규칙이나 결과는 달라지지 않아요.</div>'],
['문의','report','문제를 발견했거나 건의하고 싶어요.',
 '<p><a href="../community/">커뮤니티</a>의 피드백에서 남겨 주세요. 글을 쓰실 때 아래 내용이 있으면 고치기가 훨씬 쉬워요.</p><ul><li>어떤 게임이나 프로그램인지</li><li>어떤 기기와 브라우저인지 (예: 윈도우 크롬, 아이폰 사파리)</li><li>무엇을 했을 때 어떻게 됐는지</li><li>화면 사진 (있으면 가장 좋아요)</li></ul><p>건의도 환영해요. 이런 게 있었으면 좋겠다, 이 부분이 불편하다 같은 이야기를 편하게 남겨 주세요.</p>'],
['문의','copy','자료를 가져다 써도 되나요?',
 '<p>이 사이트의 내용은 CC BY-NC-ND 4.0 라이선스예요. 쉽게 말해 이래요.</p><ul><li>출처(Frenchfries777)를 밝히면 그대로 공유할 수 있어요.</li><li>돈을 버는 목적으로는 쓸 수 없어요.</li><li>내용을 바꿔서 다시 배포할 수는 없어요.</li></ul><p>배경음악 일부는 원작자의 라이선스(예: CC BY 4.0)를 따라요. 곡마다 출처를 적어 두었으니 그쪽 조건을 지켜 주세요.</p>']
];

(function(){
 var app=document.getElementById('app'),list=document.getElementById('list'),ans=document.getElementById('ans'),q=document.getElementById('q'),none=document.getElementById('none');
 var byId={},cat='';
 function esc(s){return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
 QA.forEach(function(r){byId[r[1]]=r;});
 function render(){
  var h='',last='';
  QA.forEach(function(r){ if(r[0]!==last){ h+='<h2 data-c="'+esc(r[0])+'">'+esc(r[0])+'</h2>'; last=r[0]; } h+='<button type="button" data-id="'+r[1]+'">'+esc(r[2])+'</button>'; });
  list.innerHTML=h;
 }
 function show(id,push){
  var r=byId[id]||QA[0]; id=r[1];
  var rel=QA.filter(function(x){return x[0]===r[0]&&x[1]!==id;}).slice(0,3);
  ans.innerHTML='<button type="button" class="back" id="back">← 질문 목록</button><div class="crumb">'+esc(r[0])+'</div><h1>'+esc(r[2])+'</h1>'+r[3]+
   (rel.length?'<div class="rel">같이 보면 좋아요: '+rel.map(function(x){return '<a data-go="'+x[1]+'">'+esc(x[2])+'</a>';}).join('')+'</div>':'');
  [].forEach.call(list.querySelectorAll('button'),function(b){b.classList.toggle('on',b.getAttribute('data-id')===id);});
  document.title=r[2]+' · 도움말 · Frenchfries777';
  document.querySelector('.main').scrollTop=0; window.scrollTo(0,0);
  if(push!==false){ try{ history.replaceState(null,'','#'+id); }catch(e){ location.hash=id; } }
  document.getElementById('back').onclick=function(){ app.classList.remove('sel'); window.scrollTo(0,0); };
 }
 function pick(id){ app.classList.add('sel'); show(id); }
 list.addEventListener('click',function(e){ var b=e.target.closest('button[data-id]'); if(b) pick(b.getAttribute('data-id')); });
 ans.addEventListener('click',function(e){ var a=e.target.closest('[data-go]'); if(a){ e.preventDefault(); pick(a.getAttribute('data-go')); } });
 function filter(){
  var v=q.value.trim().toLowerCase(),n=0,seen={};
  [].forEach.call(list.querySelectorAll('button'),function(b){ var r=byId[b.getAttribute('data-id')]; var t=(r[0]+' '+r[2]+' '+r[3].replace(/<[^>]+>/g,' ')).toLowerCase(); var m=!v||t.indexOf(v)>=0; b.style.display=m?'':'none'; if(m){n++; seen[r[0]]=1;} });
  [].forEach.call(list.querySelectorAll('h2'),function(h){ h.style.display=seen[h.getAttribute('data-c')]?'':'none'; });
  none.style.display=n?'none':'block';
 }
 q.addEventListener('input',filter);
 render();
 var id=(location.hash||'').slice(1);
 if(id&&byId[id]){ app.classList.add('sel'); show(id,false); } else { show(QA[0][1],false); }
 window.addEventListener('hashchange',function(){ var i=(location.hash||'').slice(1); if(byId[i]){ app.classList.add('sel'); show(i,false); } });
})();
</script>
<script src="https://frenchfries777.com/games/ff-auth.js?v=20261107h"></script>
<script>
/* 질문 남기기: 로그인한 사람이 질문, 개발자(ff_devs)가 답변 */
(function(){
 var app=document.getElementById('app'),ans=document.getElementById('ans'),list=document.getElementById('list'),tabF=document.getElementById('tabF'),tabA=document.getElementById('tabA');
 var sb=null,me=null,ver=0;
 function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
 function dt(t){ try{ var d=new Date(t); return d.getFullYear()+'.'+(d.getMonth()+1)+'.'+d.getDate()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }catch(e){ return ''; } }
 function ready(){ return window.FFAuth?window.FFAuth.ready.then(function(){ sb=FFAuth.client(); me=FFAuth.user(); return sb; }):Promise.resolve(null); }
 function mark(on){ tabA.classList.toggle('on',on); tabF.classList.toggle('on',!on); }
 var cache={};
 async function people(ids){
  ids=ids.filter(function(i,k){return i&&ids.indexOf(i)===k&&!cache[i];}); if(!ids.length||!sb) return;
  try{ var r=await sb.from('profiles').select('id,username,display_name').in('id',ids); ((r&&r.data)||[]).forEach(function(p){ cache[p.id]={n:(p.display_name&&String(p.display_name).trim())||p.username||'???'}; }); }catch(e){}
  try{ var a=await sb.from('ff_avatar').select('user_id,pick').in('user_id',ids); ((a&&a.data)||[]).forEach(function(x){ if(cache[x.user_id]) cache[x.user_id].p=x.pick; }); }catch(e){}
  ids.forEach(function(i){ if(!cache[i]) cache[i]={n:'???'}; });
 }
 function avSrc(id){ var p=cache[id]&&cache[id].p, B='https://frenchfries777.com/games/'; return p&&/^[a-z0-9_-]{1,30}$/i.test(p)?B+'avatars/'+p+(/^(stk|ce|bf|ip|dp|vk)_/.test(p)?'.png':'.svg'):B+'hubicons/account.svg'; }
 function who(id,t,dev){ var c=cache[id]||{n:'???'};
  return '<div class="qa-who"><img src="'+esc(avSrc(id))+'" alt="" loading="lazy"><a data-uid="'+esc(id)+'" data-notr>'+esc(c.n)+'</a>'+(window.FFAuth&&FFAuth.devBadge?FFAuth.devBadge(id):'')+'<small>'+esc(dt(t))+'</small></div>'; }
 function isDev(){ return !!(me&&window.FFAuth&&FFAuth.devRole&&FFAuth.devRole(me.id)); }
 function put(h){ ans.innerHTML=h; app.classList.add('sel'); document.querySelector('.main').scrollTop=0; window.scrollTo(0,0); }
 function bind(){ var b=document.getElementById('back'); if(b) b.onclick=function(){ app.classList.remove('sel'); window.scrollTo(0,0); }; }

 async function showList(push){
  var my=++ver; mark(true); [].forEach.call(list.querySelectorAll('button'),function(b){b.classList.remove('on');});
  if(push!==false) try{ history.replaceState(null,'','#ask'); }catch(e){}
  put('<button type="button" class="back" id="back">← 질문 목록</button><div class="crumb">질문 남기기</div><h1>궁금한 걸 남겨 주세요</h1><p class="qa-msg">불러오는 중…</p>'); bind();
  await ready(); if(my!==ver) return;
  if(window.FFAuth&&FFAuth.loadDevs) await FFAuth.loadDevs();
  var form;
  if(!sb) form='<p class="qa-msg">지금은 질문을 불러올 수 없어요.</p>';
  else if(!me) form='<p>질문은 로그인한 사람만 남길 수 있어요.</p><p><button type="button" class="qa-b" id="qaLogin">로그인</button></p>';
  else form='<div class="qa-f"><input id="qaT" maxlength="80" placeholder="제목" aria-label="제목"><textarea id="qaB" maxlength="1000" placeholder="내용 (선택)" aria-label="내용"></textarea><button type="button" class="qa-b" id="qaGo">질문 남기기</button> <span class="qa-msg" id="qaM"></span></div>';
  var rows=[],ac={};
  if(sb){ try{ var r=await sb.from('ff_help_q').select('id,user_id,title,created_at').order('created_at',{ascending:false}).limit(60); if(r.error) throw r.error; rows=r.data||[];
    if(rows.length){ var a=await sb.from('ff_help_a').select('q_id').in('q_id',rows.map(function(x){return x.id;})); ((a&&a.data)||[]).forEach(function(x){ ac[x.q_id]=(ac[x.q_id]||0)+1; }); } }catch(e){ form+='<p class="qa-msg qa-err">질문 기능이 아직 준비되지 않았어요.</p>'; } }
  if(my!==ver) return; await people(rows.map(function(x){return x.user_id;})); if(my!==ver) return;
  var h='<button type="button" class="back" id="back">← 질문 목록</button><div class="crumb">질문 남기기</div><h1>궁금한 걸 남겨 주세요</h1><p>개발자가 확인하고 답변해요. 자주 묻는 질문에 없는 내용을 남겨 주세요.</p>'+form+'<h2 style="font-size:18px;margin:26px 0 10px">남겨진 질문</h2>';
  if(!rows.length) h+='<p class="qa-msg">아직 질문이 없어요.</p>';
  rows.forEach(function(q){ h+='<button type="button" class="qa-q" data-q="'+esc(q.id)+'"><b>'+esc(q.title)+(ac[q.id]?'<span class="qa-st ok">답변 '+ac[q.id]+'</span>':'<span class="qa-st">답변 대기</span>')+'</b><small><span data-notr>'+esc((cache[q.user_id]||{}).n||'???')+'</span> · '+esc(dt(q.created_at))+'</small></button>'; });
  put(h); bind();
  var lg=document.getElementById('qaLogin'); if(lg) lg.onclick=function(){ FFAuth.openLogin(); };
  var go=document.getElementById('qaGo'); if(go) go.onclick=async function(){
   var t=document.getElementById('qaT').value.trim(), b=document.getElementById('qaB').value.trim(), m=document.getElementById('qaM');
   if(!t){ m.textContent='제목을 적어 주세요.'; return; }
   go.disabled=true; var r=await sb.from('ff_help_q').insert({user_id:me.id,title:t,body:b}).select('id').single(); go.disabled=false;
   if(r.error){ m.className='qa-msg qa-err'; m.textContent='남기지 못했어요. 하루에 10개까지 남길 수 있어요.'; return; }
   showQ(r.data.id);
  };
 }

 async function showQ(id,push){
  var my=++ver; mark(true);
  if(push!==false) try{ history.replaceState(null,'','#ask/'+id); }catch(e){}
  await ready(); if(window.FFAuth&&FFAuth.loadDevs) await FFAuth.loadDevs(); if(my!==ver) return;
  var q=null,as=[];
  try{ var r=await sb.from('ff_help_q').select('id,user_id,title,body,created_at').eq('id',id).limit(1); q=r.data&&r.data[0];
   var a=await sb.from('ff_help_a').select('id,user_id,body,created_at').eq('q_id',id).order('created_at'); as=(a&&a.data)||[]; }catch(e){}
  if(!q){ put('<button type="button" class="back" id="back">← 질문 목록</button><p>질문을 찾을 수 없어요.</p><p><a href="#ask" data-ask>질문 목록으로</a></p>'); bind(); return; }
  await people([q.user_id].concat(as.map(function(x){return x.user_id;}))); if(my!==ver) return;
  var canDel=me&&(me.id===q.user_id||isDev());
  var h='<button type="button" class="back" id="back">← 질문 목록</button><div class="crumb"><a data-ask style="cursor:pointer">질문 남기기</a></div><h1>'+esc(q.title)+'</h1>'+who(q.user_id,q.created_at)+(q.body?'<p class="qa-qb">'+esc(q.body)+'</p>':'')+(canDel?'<p><button type="button" class="qa-del" data-dq="1">이 질문 지우기</button></p>':'')+'<h2 style="font-size:18px;margin:24px 0 10px">답변 '+as.length+'</h2>';
  if(!as.length) h+='<p class="qa-msg">아직 답변이 없어요.</p>';
  as.forEach(function(x){ var d=me&&(me.id===x.user_id||(FFAuth.devRole(me.id)==='owner'));
   h+='<div class="qa-a">'+who(x.user_id,x.created_at)+'<div class="t">'+esc(x.body)+'</div>'+(d?'<p style="margin:6px 0 0"><button type="button" class="qa-del" data-da="'+esc(x.id)+'" style="margin:0">답변 지우기</button></p>':'')+'</div>'; });
  if(isDev()) h+='<div class="qa-f"><textarea id="qaA" maxlength="2000" placeholder="답변" aria-label="답변"></textarea><button type="button" class="qa-b" id="qaAGo">답변 남기기</button> <span class="qa-msg" id="qaAM"></span></div>';
  put(h); bind();
  var g=document.getElementById('qaAGo'); if(g) g.onclick=async function(){
   var v=document.getElementById('qaA').value.trim(), m=document.getElementById('qaAM'); if(!v){ m.textContent='답변을 적어 주세요.'; return; }
   g.disabled=true; var r=await sb.from('ff_help_a').insert({q_id:id,user_id:me.id,body:v}); g.disabled=false;
   if(r.error){ m.className='qa-msg qa-err'; m.textContent='남기지 못했어요.'; return; } showQ(id,false);
  };
  ans.onclick=async function(e){
   var u=e.target.closest('[data-uid]'); if(u&&window.FFAuth) { FFAuth.openProfile(u.getAttribute('data-uid')); return; }
   if(e.target.closest('[data-ask]')){ showList(); return; }
   var da=e.target.closest('[data-da]'); if(da){ if(da.getAttribute('data-sure')!=='1'){ da.setAttribute('data-sure','1'); da.textContent='한 번 더 누르면 지워요'; return; } await sb.from('ff_help_a').delete().eq('id',da.getAttribute('data-da')); showQ(id,false); return; }
   var dq=e.target.closest('[data-dq]'); if(dq){ if(dq.getAttribute('data-sure')!=='1'){ dq.setAttribute('data-sure','1'); dq.textContent='한 번 더 누르면 지워요'; return; } await sb.from('ff_help_q').delete().eq('id',id); showList(); return; }
  };
 }
 ans.addEventListener('click',function(e){
  if(e.target.closest('[data-ask]')){ e.preventDefault(); showList(); return; }
  var q=e.target.closest('[data-q]'); if(q){ showQ(q.getAttribute('data-q')); return; }
  var u=e.target.closest('[data-uid]'); if(u&&window.FFAuth&&FFAuth.openProfile) FFAuth.openProfile(u.getAttribute('data-uid'));
 });
 tabA.addEventListener('click',function(){ showList(); });
 tabF.addEventListener('click',function(){ ver++; mark(false); try{ history.replaceState(null,'','#'); }catch(e){} var b=list.querySelector('button'); if(b) b.click(); });
 list.addEventListener('click',function(){ ver++; mark(false); });
 function route(){ var h=(location.hash||'').slice(1); if(h==='ask'){ app.classList.add('sel'); showList(false); } else if(h.indexOf('ask/')===0){ app.classList.add('sel'); showQ(h.slice(4),false); } }
 window.addEventListener('hashchange',route); route();
})();
</script>
