    '<button type="button" class="chip'+(isT(sel)?' on':'')+'" data-k="tools">Tools</button>'+(isT(sel)?'<select class="chip tsel" id="tsel"><option value="tools"'+(sel==='tools'?' selected':'')+'>'+esc(lang==='ko'?'Tools 전체':'All Tools')+'</option>'+TOOLS.map(function(t){ return '<option value="tools_'+t[0]+'"'+(sel==='tools_'+t[0]?' selected':'')+'>'+esc(t[1])+'</option>'; }).join('')+'</select>':'')+
    '<input class="srch" id="q" type="search" placeholder="'+esc(lang==='ko'?'빌드 번호나 내용으로 검색':T.search)+'" value="'+esc(q)+'">';
  $('#bar').innerHTML=h;
  $('#q').oninput=function(){ q=this.value; shown=30; paintList(); };
  var ts=$('#tsel'); if(ts) ts.onchange=function(){ sel=this.value; shown=30; paintBar(); paintList(); try{ history.replaceState(null,'','#'+sel); }catch(e){} };
  var bs=document.querySelectorAll('#bar button.chip'); for(var i=0;i<bs.length;i++) bs[i].onclick=function(){ sel=this.getAttribute('data-k'); shown=30; paintBar(); paintList(); try{ history.replaceState(null,'','#'+sel); }catch(e){} };
  var el=$('#q'); }
function paintList(){
  var box=$('#list'), ql=q.trim().toLowerCase();
  var rows=all.filter(function(n){ return (sel==='all'||n.g===sel||(sel==='tools'&&n.s.tool))&&(!ql||(window.FFPN?FFPN.match({build:n.build,t:n.t,o:n.o},q):(n.t.title+' '+n.t.items.join(' ')+' '+n.build).toLowerCase().indexOf(ql)>=0)); });
  if(!rows.length){ box.innerHTML='<div class="'+(failed&&!all.length?'err':'empty')+'">'+esc(failed&&!all.length?T.err:T.empty)+'</div>'; return; }
  var out='', last='';
  rows.slice(0,shown).forEach(function(n){
    if(n.date!==last){ last=n.date; out+='<div class="day">'+esc(n.date)+'</div>'; }
    out+='<article class="card" style="--c:var('+n.s.c+')"><div class="h"><span class="g">'+esc(n.g==='hub'?(lang==='ko'?'허브':T.hubN):n.s.name)+'</span>'+(n.build?'<span>'+esc(n.build)+'</span>':'')+'<span>'+esc(T.items.replace('{0}',n.t.items.length))+'</span></div>'+
      '<h3>'+esc(n.t.title)+'</h3><ul>'+n.t.items.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul></article>'; });
  if(rows.length>shown) out+='<button type="button" class="more" id="more">'+esc(T.more)+'</button>';
  box.innerHTML=out; if(window.FFPN) FFPN.highlight(box,q); var m=$('#more'); if(m) m.onclick=function(){ shown+=30; paintList(); };
}
function load(){
  return Promise.all(SRC.map(function(s,si){ return window.FF_REG_NOTES(s.e).then(function(l){ var d=l?{notes:l}:null;
    if(!d){ failed++; return []; } return (d.notes||[]).map(function(n,i){ return {g:s.k,s:s,i:i,si:si,date:n.date||'',build:n.build||'',t:tr(n),o:{title:n.title,items:n.items}}; }); }); }))
  .then(function(l){ all=[].concat.apply([],l).sort(function(a,b){ return (b.date>a.date?1:b.date<a.date?-1:0)||(a.si-b.si)||(a.i-b.i); }); paintList(); });
}
(function init(){
  document.documentElement.lang=lang; $('#hubBtn span').textContent=T.hub; $('#lead').textContent=T.lead;
  var ls=$('#lang'); var VL={"ko": "가상 언어", "en": "Fictional languages", "es": "Idiomas ficticios", "fr": "Langues fictives", "de": "Fiktive Sprachen", "ja": "架空の言語", "zh": "虚构语言", "pt": "Idiomas fictícios", "ru": "Вымышленные языки", "tr": "Kurgusal diller","it":"Lingue immaginarie","pl":"Języki fikcyjne","ar":"لغات خيالية", "nw": "Fictional speaks","gk":"Fictional 언어들"}, cur=(window.FFLang&&FFLang.pick)?FFLang.pick():lang, op=function(k){ return '<option value="'+k+'"'+(k===cur?' selected':'')+'>'+NAMES[k]+'</option>'; }, vk=function(k){ return k==='nw'||k==='gk'||(k==='au'||k==='sg'||k==='em'); };
  ls.innerHTML=LN.filter(function(k){ return !vk(k); }).map(op).join('')+'<optgroup label="'+(VL[lang]||VL.en)+'">'+LN.filter(vk).map(op).join('')+'</optgroup>';
  ls.onchange=function(){ try{ localStorage.setItem('arenaClashLang',this.value); }catch(e){} try{ if(window.FFLang) FFLang.set(this.value); }catch(e){} location.reload(); };
  var h=(location.hash||'').slice(1); if(h==='tools'||SRC.some(function(s){ return s.k===h; })) sel=h;
  paintBar(); load();
})();
})();
</script>
</body>
