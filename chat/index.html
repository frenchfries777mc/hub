<div id="root"></div>
<script>
(function(){
var root=document.getElementById('root'), sb=null, me=null;

function el(t,c,x){var e=document.createElement(t); if(c) e.className=c; if(x!=null) e.textContent=x; return e;}
function nick(p){ return (p&&(p.display_name||p.username))||'알 수 없음'; }
function initial(s){ return (s||'?').trim().charAt(0).toUpperCase(); }
function pad(n){return n<10?'0'+n:''+n;}
function hm(d){ d=new Date(d); var h=d.getHours(); return (h<12?'오전 ':'오후 ')+(h%12||12)+':'+pad(d.getMinutes()); }
function dayKey(d){ d=new Date(d); return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); }
function dayLabel(d){ d=new Date(d); var w='일월화수목금토'[d.getDay()]; return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 '+w+'요일'; }
function shortTime(d){ var t=new Date(d), n=new Date(); if(dayKey(t)===dayKey(n)) return hm(t); var y=new Date(n-864e5); if(dayKey(t)===dayKey(y)) return '어제'; return (t.getMonth()+1)+'월 '+t.getDate()+'일'; }
function toast(s){ var t=el('div','toast',s); document.body.appendChild(t); setTimeout(function(){t.remove();},2200); }

async function boot(){

function layout(){
  var app=el('div','app'); app.id='app';

async function loadAll(){

async function nameOf(ids){
  var need=ids.filter(function(i){return !names[i];}); if(!need.length) return;
  var r=await sb.from('profiles').select('id,username,display_name').in('id',need);

}
async function loadFriends(){
  var r=await sb.from('friendships').select('requester_id,addressee_id,status').or('requester_id.eq.'+me.id+',addressee_id.eq.'+me.id);
  var ids=[]; ((r&&r.data)||[]).forEach(function(x){ if(x.status!=='accepted') return; var o=x.requester_id===me.id?x.addressee_id:x.requester_id; if(ids.indexOf(o)<0) ids.push(o); });
  await nameOf(ids); loadAvatars(ids);
  friends=ids.map(function(i){return {id:i,name:names[i]||'알 수 없음'};}).sort(function(a,b){return a.name.localeCompare(b.name,'ko');});
}
async function loadRooms(){
  var r=await sb.from('ffc_members').select('room_id,last_read_at,'+(V3?'ffc_rooms(id,kind,name,last_at,last_text,created_by,notice)':'ffc_rooms(id,kind,name,last_at,last_text,created_by)')+'').eq('user_id',me.id);
  if(r.error){ rooms=[]; root.dataset.err=r.error.message; return; }
  rooms=((r.data)||[]).filter(function(x){return x.ffc_rooms;}).map(function(x){ var o=x.ffc_rooms; return {id:o.id,kind:o.kind,name:o.name,created_by:o.created_by,notice:o.notice||null,last_at:o.last_at,last_text:o.last_text,read:x.last_read_at,unread:0,members:[]}; });
  if(!rooms.length) return;
  var ids=rooms.map(function(x){return x.id;});
  var m=await sb.from('ffc_members').select('room_id,user_id').in('room_id',ids);
  var uids=[]; ((m&&m.data)||[]).forEach(function(x){ var rm=rooms.find(function(y){return y.id===x.room_id;}); if(rm) rm.members.push(x.user_id); if(uids.indexOf(x.user_id)<0) uids.push(x.user_id); });
  await nameOf(uids); loadAvatars(uids);
  await Promise.all(rooms.map(async function(rm){
    var c=await sb.from('ffc_msgs').select('id',{count:'exact',head:true}).eq('room_id',rm.id).neq('user_id',me.id).gt('created_at',rm.read);
    rm.unread=(c&&c.count)||0;
  }));
  rooms.sort(function(a,b){return new Date(b.last_at)-new Date(a.last_at);});
}
function roomTitle(rm){
  if(rm.kind==='group') return (rm.name||'그룹 채팅');
  var o=rm.members.find(function(i){return i!==me.id;}); return (o&&names[o])||'알 수 없음';
}
function paintList(){
  var list=$('#list'); if(!list) return; list.innerHTML='';
  if(tab==='friends'){
    if(!friends.length){ list.appendChild(el('div','empty','아직 친구가 없어요.\n계정 메뉴의 친구에서 친구를 추가해 보세요.')); return; }
    friends.forEach(function(f){
      var b=el('button','row'); b.innerHTML='<span class="rm"><b></b></span>'; b.insertBefore(avEl(f.id),b.firstChild); $('b',b).textContent=f.name;

    }); return;
  }

  if(!rooms.length){ list.appendChild(el('div','empty','대화가 없어요.\n친구 탭에서 친구를 눌러 시작해 보세요.')); return; }
  rooms.forEach(function(rm){
    var t=roomTitle(rm), b=el('button','row'+(cur&&cur.id===rm.id?' on':''));
    b.innerHTML='<span class="av"></span><span class="rm"><b></b><span></span></span><span class="meta"><span class="tt"></span></span>';
    $('.av',b).replaceWith(roomAv(rm));
    $('b',b).textContent=t; $('.rm>span',b).textContent=rm.last_text||'대화를 시작해 보세요';
    $('.tt',b).textContent=rm.last_text?shortTime(rm.last_at):'';
    if(rm.unread){ var u=el('span','bd',rm.unread>99?'99+':rm.unread); $('.meta',b).appendChild(u); }
    b.onclick=function(){ openRoom(rm.id); }; list.appendChild(b);
  });
}
async function openDm(fid){
  var r=await sb.rpc('ffc_open_dm',{friend:fid}); if(r.error){ toast('대화방을 열 수 없어요'); return; }
  await loadRooms(); tab='chats'; [].forEach.call(document.querySelectorAll('.tabs button'),function(x){x.classList.toggle('on',x.getAttribute('data-t')==='chats');});
  openRoom(r.data);
}
async function openRoom(id){
  var rm=rooms.find(function(x){return x.id===id;});
  if(!rm){ await loadRooms(); rm=rooms.find(function(x){return x.id===id;}); }
  if(!rm){ toast('대화방을 찾을 수 없어요'); return; }
  cur=rm; msgs=[]; seen={}; oldest=null;
  $('#app').classList.add('open'); paintMain(); paintList();
  var r=await sb.from('ffc_msgs').select(COLS).eq('room_id',id).order('id',{ascending:false}).limit(60);
  var rows=((r&&r.data)||[]).reverse(); await nameOf(rows.map(function(x){return x.user_id;})); loadAvatars(rows.map(function(x){return x.user_id;}));
  await loadReacts(rows.map(function(x){return x.id;}));
  rows.forEach(function(x){ seen[x.id]=1; msgs.push(x); }); oldest=rows.length?rows[0].id:null;
  paintMsgs(true); markRead();
}
function paintMain(){
  var main=$('#main'); main.innerHTML='';
  if(!cur){ var hr=el('div','hero'); hr.innerHTML='<div class="logo">🍟</div><h2>FRENCHFRIES777 CHAT</h2><p>왼쪽에서 대화를 고르거나<br>친구를 눌러 새 대화를 시작해 보세요.</p><div class="tips"><span>1:1 대화</span><span>그룹 채팅</span><span>실시간</span></div>'; main.appendChild(hr); return; }
  var ch=el('div','ch'); var back=el('button','back','‹'); back.onclick=function(){ cur=null; $('#app').classList.remove('open'); paintMain(); paintList(); };
  var t=el('div','t'); t.appendChild(el('b','',roomTitle(cur))); t.appendChild(el('span','',memberLine(cur)));
  var more=el('button','more','⋯'); more.title='메뉴';
  more.onclick=function(e){ e.stopPropagation(); var old=$('.menu',ch); if(old){ old.remove(); return; }
    var mn=el('div','menu'); var cl=el('button','','대화 닫기'); cl.onclick=function(){ cur=null; $('#app').classList.remove('open'); paintMain(); paintList(); };
    var del=el('button','del','대화방 삭제'); var armed=false;
    del.onclick=async function(ev){ ev.stopPropagation(); if(!armed){ armed=true; del.textContent='한 번 더 누르면 삭제돼요'; return; }
      var rid=cur.id; await sb.rpc('ffc_leave',{rid:rid}); cur=null; await loadRooms(); $('#app').classList.remove('open'); paintMain(); paintList(); toast('대화방을 삭제했어요'); };
    var mb=el('button','',cur.kind==='group'?'👥 멤버 · 초대':'👥 대화 상대 · 초대'); mb.onclick=function(){ mn.remove(); membersModal(); };
    var nb2=el('button','','📌 공지 '+(cur.notice?'바꾸기':'올리기')); nb2.onclick=function(){ mn.remove(); noticeModal(); };
    var sb2=el('button','','⏰ 예약 메시지'); sb2.onclick=function(){ mn.remove(); schedModal(''); };
    mn.appendChild(mb); if(V3){ mn.appendChild(nb2); mn.appendChild(sb2); } mn.appendChild(cl); mn.appendChild(del); ch.appendChild(mn);
    setTimeout(function(){ document.addEventListener('click',function h(ev){ if(!mn.contains(ev.target)){ mn.remove(); document.removeEventListener('click',h); } }); },0); };
  var hav=roomAv(cur); t.style.cursor='pointer'; t.onclick=membersModal; ch.appendChild(back); ch.appendChild(hav); ch.appendChild(t); ch.appendChild(more); main.appendChild(ch);
  var box=el('div','msgs'); box.id='msgs'; main.appendChild(box); setTimeout(paintNotice,0);
  var bar=el('div','bar'); var ta=el('textarea'); ta.rows=1; ta.maxLength=2000; ta.placeholder='메시지를 입력하세요'; var send=el('button','','전송'); send.disabled=true;
  ta.oninput=function(){ send.disabled=!ta.value.trim(); ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,120)+'px'; };
  ta.onpaste=function(e){ var fs=[].filter.call((e.clipboardData&&e.clipboardData.files)||[],function(f){ return /^image\//.test(f.type); }); if(fs.length){ e.preventDefault(); sendImages(fs); } };
  main.ondragover=function(e){ if(e.dataTransfer&&[].some.call(e.dataTransfer.items||[],function(i){ return i.kind==='file'; })){ e.preventDefault(); main.classList.add('drop'); } };
  main.ondragleave=function(e){ if(e.target===main||!main.contains(e.relatedTarget)) main.classList.remove('drop'); };
  main.ondrop=function(e){ main.classList.remove('drop'); if(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length){ e.preventDefault(); sendImages(e.dataTransfer.files); } };
  ta.onkeydown=function(e){ if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); go(); } };
  async function go(){ var v=ta.value.trim(); if(!v||!cur) return; ta.value=''; send.disabled=true; ta.style.height='auto';
    var row={room_id:cur.id,user_id:me.id,body:v}; if(replyTo&&V2){ row.meta={reply:replyTo}; } replyTo=null; paintReplyBar();
    var r=await sb.from('ffc_msgs').insert(row).select(COLS).single();
    if(r.error){ toast('보내지 못했어요'); ta.value=v; send.disabled=false; return; } add(r.data);
    var am=AIRE.exec(v); if(am&&V2) askAI(aiKey(am[1]),v.replace(AIRE,'').trim()); }
  send.onclick=go;
  var tools=el('div','tools');

  if(others().length) tb('🎲','Hub Coin 내기',betModal);
  if(cur.kind==='group') tb('🏆','대진표',bracketModal);

function paintMsgs(bottom){
  var box=$('#msgs'); if(!box) return; var keep=box.scrollHeight-box.scrollTop; box.innerHTML='';
  if(oldest!==null&&msgs.length>=60){ var ob=el('button','older','이전 대화 보기'); ob.onclick=older; box.appendChild(ob); }
  var lastDay='', lastU=null, lastT=0;
  if(!(oldest!==null&&msgs.length>=60)){ var it=el('div','intro'); var ia=roomAv(cur); it.appendChild(ia); it.appendChild(el('b','',roomTitle(cur))); it.appendChild(el('span','',cur.kind==='group'?'멤버 '+cur.members.length+'명이 함께하는 그룹 채팅이에요.\n첫 인사를 건네 보세요.':'1:1 대화가 시작됐어요.\n첫 인사를 건네 보세요.')); it.lastChild.style.whiteSpace='pre-line'; if(cur.kind==='group'){ var mr=el('div','mrow'); cur.members.forEach(function(i){ var c=el('span','mchip'); c.appendChild(avEl(i,'xs')); c.appendChild(document.createTextNode((names[i]||'?')+(i===me.id?' (나)':''))); mr.appendChild(c); }); it.appendChild(mr); } box.appendChild(it); }

    var mine=m.user_id===me.id, first=lastU!==m.user_id, nx=msgs[i+1], last=!(nx&&nx.user_id===m.user_id&&dayKey(nx.created_at)===dk&&hm(nx.created_at)===hm(m.created_at));
    var row=el('div','m'+(mine?' me':'')+(first?' gap':''));
    if(V2&&m.kind==='sys'){ box.appendChild(el('div','sys',(names[m.user_id]||'')+'님이 '+m.body)); lastU=null; return; }
    if(!mine){ var av=avEl(m.user_id); if(!first) av.style.visibility='hidden'; row.appendChild(av); }
    var col=el('div','col'); if(!mine&&first&&cur.kind==='group') col.appendChild(el('div','nm',names[m.user_id]||'알 수 없음'));
    row.dataset.mid=m.id;
    var rb=m.kind==='del'?el('div','b del','삭제된 메시지예요'):renderBody(m);
    if(m.meta&&m.meta.reply&&rb.classList.contains('b')) rb.insertBefore(quoteBox(m.meta.reply),rb.firstChild);

async function older(){
  var r=await sb.from('ffc_msgs').select(COLS).eq('room_id',cur.id).lt('id',oldest).order('id',{ascending:false}).limit(60);
  var rows=((r&&r.data)||[]).reverse(); await nameOf(rows.map(function(x){return x.user_id;}));
  await loadReacts(rows.map(function(x){return x.id;}));
  rows.forEach(function(x){ seen[x.id]=1; }); msgs=rows.concat(msgs); oldest=rows.length?rows[0].id:null; if(rows.length<60) oldest=null; paintMsgs(false);

function canUnsend(m){ return V3&&m.user_id===me.id&&m.kind!=='del'&&['text','sticker','image','result',undefined,null].indexOf(m.kind)>=0&&Date.now()-new Date(m.created_at).getTime()<300000; }

/* 예약 메시지 */
function pad2(n){ return (n<10?'0':'')+n; }
function localDT(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+'T'+pad2(d.getHours())+':'+pad2(d.getMinutes()); }

  if(!V3){ toast('아직 준비 중이에요'); return; } var rid=cur.id;

  var l1=el('label','fl2'); l1.appendChild(el('span','','메시지')); l1.appendChild(ta); var l2=el('label','fl2'); l2.appendChild(el('span','','보낼 시각')); l2.appendChild(dt); f.appendChild(l1); f.appendChild(l2);

    a.forEach(function(x){ var row=el('div','srow'); row.appendChild(el('span','st2',new Date(x.send_at).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'numeric',minute:'2-digit'}))); row.appendChild(el('span','sb2',x.body)); var c=el('button','','취소'); c.onclick=async function(){ await sb.from('ffc_sched').delete().eq('id',x.id); loadList(); }; row.appendChild(c); list.appendChild(row); }); }

/* ---------- 실시간: 내기·대진표 바뀜 ---------- */
function subscribeExt(ch){
  if(!V2) return ch;
  if(V3) ch=ch.on('postgres_changes',{event:'UPDATE',schema:'public',table:'ffc_msgs'},function(p){ var d=p.new; if(!d||!cur||d.room_id!==cur.id) return; var m=msgs.find(function(x){ return x.id===d.id; }); if(m){ m.kind=d.kind; m.body=d.body; m.meta=d.meta; paintMsgs(false); } })
    .on('postgres_changes',{event:'*',schema:'public',table:'ffc_reacts'},function(p){ var d=p.eventType==='DELETE'?p.old:p.new; if(!d||!cur||d.room_id!==cur.id) return; var a=reacts[d.msg_id]=(reacts[d.msg_id]||[]).filter(function(x){ return !(x.user_id===d.user_id&&x.emoji===d.emoji); }); if(p.eventType!=='DELETE') a.push(d); paintMsgs(false); })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'ffc_rooms'},function(p){ var d=p.new; if(!d) return; var rm=rooms.find(function(x){ return x.id===d.id; }); if(rm) rm.notice=d.notice||null; if(cur&&cur.id===d.id){ cur.notice=d.notice||null; paintNotice(); } });
  return ch.on('postgres_changes',{event:'*',schema:'public',table:'ffc_bets'},function(p){ var d=p.new; if(d&&d.id){ bets[d.id]=d; nameOf([d.a,d.b]).then(function(){ if(cur&&d.room_id===cur.id) paintMsgs(false); }); } })
           .on('postgres_changes',{event:'*',schema:'public',table:'ffc_brackets'},function(p){ var d=p.new; if(d&&d.id){ brackets[d.id]=d; if(cur&&d.room_id===cur.id) paintMsgs(false); } });
}

/* ===== 실시간 보강: 연결이 끊기거나 탭이 잠들었다 돌아와도 놓친 메시지를 바로 채워요 ===== */
var live=false, everLive=false, syncBusy=false, roomsAt=0;
async function syncNow(full){
  if(!me||!sb||syncBusy) return; syncBusy=true;
  try{
    if(cur){
      var rid=cur.id, last=0; msgs.forEach(function(x){ if(x.id>last) last=x.id; });
      if(last){
        var r=await sb.from('ffc_msgs').select(COLS).eq('room_id',rid).gt('id',last).order('id').limit(100);
        var rows=(r&&r.data)||[];
        if(rows.length&&cur&&cur.id===rid){ await nameOf(rows.map(function(x){return x.user_id;})); await loadReacts(rows.map(function(x){return x.id;})); rows.forEach(add); }
      }
    }
    if(full||Date.now()-roomsAt>30000){
      roomsAt=Date.now(); var id=cur&&cur.id; await loadRooms();
      if(id){ var rm=rooms.find(function(x){return x.id===id;}); if(rm){ rm.unread=0; cur.members=rm.members; cur.created_by=rm.created_by; cur.notice=rm.notice; if(typeof paintHead==='function') paintHead(); } }
      paintList();
    }
  }catch(e){} finally{ syncBusy=false; }
}
var tick=0; setInterval(function(){ tick++; if(document.visibilityState!=='hidden'&&(!live||tick%3===0)) syncNow(false); }, 4000);
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') syncNow(true); });

window.addEventListener('focus',function(){ syncNow(false); });

/* ===== 앱 설치: 이 채팅만 따로 설치돼요 (설치한 앱도 사이트를 그대로 열어서 업데이트가 같이 따라와요) ===== */
